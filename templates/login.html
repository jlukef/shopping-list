<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>Sign in — Shopping List</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f6f7fb;
      --card: #ffffff;
      --text: #172033;
      --muted: #667085;
      --primary: #2563eb;
      --danger: #b42318;
      --border: #d0d5dd;
      --radius: 18px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111827;
        --card: #1f2937;
        --text: #f9fafb;
        --muted: #cbd5e1;
        --border: #374151;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, rgba(37, 99, 235, .16), transparent 34%), var(--bg);
      color: var(--text);
    }
    main {
      width: min(100%, 390px);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: 0 24px 80px rgba(15, 23, 42, .18);
      padding: 28px;
    }
    h1 {
      margin: 0 0 6px;
      font-size: 1.65rem;
    }
    p {
      margin: 0 0 22px;
      color: var(--muted);
    }
    label {
      display: block;
      margin: 14px 0 6px;
      font-weight: 650;
    }
    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      font: inherit;
      background: transparent;
      color: var(--text);
    }
    .check {
      display: flex;
      gap: 10px;
      align-items: center;
      margin: 16px 0 20px;
      color: var(--muted);
    }
    .error {
      color: var(--danger);
      font-weight: 650;
      min-height: 1.2em;
      margin: 0 0 12px;
    }
    button {
      width: 100%;
      border: 0;
      border-radius: 999px;
      padding: 13px 18px;
      background: var(--primary);
      color: #fff;
      font: inherit;
      font-weight: 750;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <h1>🛒 Shopping List</h1>
    <p>Sign in to your shared household list.</p>
    <form method="post" action="/login">
      <label for="username">Username</label>
      <input id="username" name="username" type="text" autocomplete="username" required autofocus>

      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>

      <label class="check">
        <input name="keep_signed_in" type="checkbox" value="1" checked>
        Keep me signed in
      </label>

      <div class="error" role="alert">{{ error }}</div>
      <button type="submit">Sign in</button>
    </form>
  </main>
</body>
</html>
